<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Extremely simple and bold boxing representation -->
  
  <!-- Solid red background -->
  <rect width="200" height="200" fill="#FF0000"/>
  
  <!-- White fist symbol - very simple and bold -->
  <circle cx="100" cy="100" r="50" fill="#FFFFFF"/>
  
  <!-- Fist details - minimal but clear -->
  <circle cx="100" cy="100" r="30" fill="#FF0000"/>
  
  <!-- Crossed gloves symbol -->
  <path d="M60,60 L140,140 M140,60 L60,140" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Large "BOXING" text in white -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BOXING</text>
  
  <!-- Small glove icons at corners for additional clarity -->
  <circle cx="30" cy="30" r="15" fill="#FFFFFF"/>
  <circle cx="170" cy="30" r="15" fill="#FFFFFF"/>
  <circle cx="30" cy="170" r="15" fill="#FFFFFF"/>
  <circle cx="170" cy="170" r="15" fill="#FFFFFF"/>
  
  <circle cx="30" cy="30" r="8" fill="#FF0000"/>
  <circle cx="170" cy="30" r="8" fill="#FF0000"/>
  <circle cx="30" cy="170" r="8" fill="#FF0000"/>
  <circle cx="170" cy="170" r="8" fill="#FF0000"/>
</svg>