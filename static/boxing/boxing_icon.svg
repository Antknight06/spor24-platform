<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gloveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simplified Boxing Glove -->
  <path d="M20,30 Q35,15 50,20 Q65,25 70,40 Q75,60 65,75 Q50,85 35,80 Q20,75 15,60 Q10,45 20,30 Z" fill="url(#gloveGradient)" stroke="#000000" stroke-width="2"/>
  
  <!-- Fist -->
  <circle cx="45" cy="50" r="10" fill="#FF6347" stroke="#000000" stroke-width="1"/>
  
  <!-- Simple lines to represent laces -->
  <line x1="35" y1="40" x2="35" y2="60" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="60" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="45" y1="40" x2="45" y2="60" stroke="#FFFFFF" stroke-width="2"/>
</svg>