<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="canonical" href="https://www.spor24.net{{ request.path }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Spor24</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        
        /* User type specific backgrounds */
        body.admin-bg {
            background: linear-gradient(135deg, #dc3545 0%, #bd2130 100%);
        }
        
        body.yetkili-bg {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
        }
        
        body.abone-bg {
            background: linear-gradient(135deg, #17a2b8 0%, #117a8b 100%);
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }
        
        /* User type specific container borders */
        .login-container.admin-border {
            border: 3px solid #dc3545;
        }
        
        .login-container.yetkili-border {
            border: 3px solid #28a745;
        }
        
        .login-container.abone-border {
            border: 3px solid #17a2b8;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #666;
            margin-bottom: 0;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
        }
        
        /* User type specific button styles */
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-login.admin-btn {
            background: linear-gradient(135deg, #dc3545 0%, #bd2130 100%);
        }
        
        .btn-login.yetkili-btn {
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
        }
        
        .btn-login.abone-btn {
            background: linear-gradient(135deg, #17a2b8 0%, #117a8b 100%);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login.admin-btn:hover {
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }
        
        .btn-login.yetkili-btn:hover {
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .btn-login.abone-btn:hover {
            box-shadow: 0 5px 15px rgba(23, 162, 184, 0.4);
        }
        
        .alert {
            border-radius: 10px;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .user-type-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
            margin: 2px;
        }
        .admin-badge {
            background-color: #dc3545;
            color: white;
        }
        .yetkili-badge {
            background-color: #28a745;
            color: white;
        }
        .abone-badge {
            background-color: #17a2b8;
            color: white;
        }
        
        /* User type indicator */
        .user-type-indicator {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            color: white;
        }
        
        .admin-indicator {
            background-color: #dc3545;
        }
        
        .yetkili-indicator {
            background-color: #28a745;
        }
        
        .abone-indicator {
            background-color: #17a2b8;
        }
        
        /* Dynamic label styling */
        .dynamic-label {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body id="login-body">
    <div class="login-container" id="login-container">
        <div class="login-header">
            <h2>Giriş Yap</h2>
            <p>Spor24 Sistemi</p>
        </div>
        
        <!-- User Type Indicator -->
        <div class="user-type-indicator" id="user-type-indicator" style="display: none;">
            <span id="indicator-text"></span>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" id="login-form">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label dynamic-label" id="username-label">Kullanıcı Adı veya E-posta</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Kullanıcı adınızı veya e-posta adresinizi girin" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Şifre</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Şifrenizi girin" required>
            </div>
            
            <!-- Hidden field for user type -->
            <input type="hidden" id="user_type" name="user_type" value="">
            
            <div class="d-grid">
                <button type="submit" class="btn btn-login text-white" id="login-button">Giriş Yap</button>
            </div>
        </form>

        <div class="links">
            <p id="registration-link">Hesabınız yok mu? <a href="{% url 'haberler:register' %}" id="register-link">Kayıt Ol</a></p>
            <p><a href="{% url 'anasayfa' %}">← Ana Sayfaya Dön</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get user type from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const userType = urlParams.get('user_type');
        
        // Apply styling based on user type
        if (userType) {
            document.getElementById('user_type').value = userType;
            
            const body = document.getElementById('login-body');
            const container = document.getElementById('login-container');
            const button = document.getElementById('login-button');
            const indicator = document.getElementById('user-type-indicator');
            const indicatorText = document.getElementById('indicator-text');
            const registerLink = document.getElementById('register-link');
            const usernameLabel = document.getElementById('username-label');
            const usernameInput = document.getElementById('username');
            
            // Update registration link to include user type
            if (registerLink) {
                registerLink.href = "{% url 'haberler:register' %}?user_type=" + userType;
            }
            
            // Set user type specific styles
            switch(userType) {
                case 'admin':
                    body.className = 'admin-bg';
                    container.classList.add('admin-border');
                    button.classList.add('admin-btn');
                    indicator.style.display = 'block';
                    indicator.classList.add('admin-indicator');
                    indicatorText.textContent = 'YÖNETİCİ GİRİŞİ';
                    // Hide registration link for admin
                    document.getElementById('registration-link').style.display = 'none';
                    break;
                case 'yetkili':
                    body.className = 'yetkili-bg';
                    container.classList.add('yetkili-border');
                    button.classList.add('yetkili-btn');
                    indicator.style.display = 'block';
                    indicator.classList.add('yetkili-indicator');
                    indicatorText.textContent = 'YETKİLİ GİRİŞİ';
                    usernameLabel.textContent = 'Kullanıcı Adı veya E-posta';
                    usernameInput.placeholder = 'Kullanıcı adınızı veya e-postanızı girin';
                    usernameInput.type = 'text';
                    break;
                case 'abone':
                    body.className = 'abone-bg';
                    container.classList.add('abone-border');
                    button.classList.add('abone-btn');
                    indicator.style.display = 'block';
                    indicator.classList.add('abone-indicator');
                    indicatorText.textContent = 'ABONE GİRİŞİ';
                    usernameLabel.textContent = 'Kullanıcı Adı veya E-posta';
                    usernameInput.placeholder = 'Kullanıcı adınızı veya e-postanızı girin';
                    usernameInput.type = 'text';
                    break;
            }
        }
    </script>
</body>
</html>
