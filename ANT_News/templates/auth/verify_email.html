<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabı Doğrula - ANT Haber</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .login-container { /* login.html'deki stilin aynısı */
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            margin: auto; /* Ortalamak için */
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
        }
        .btn-login { /* login.html'deki ana buton stili */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Hesabınızı Doğrulayın</h2>
            <p>ANT Haber Sistemi</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <p class="text-center">
            <strong>{{ user_email }}</strong> adresine gönderilen 6 haneli doğrulama kodunu girin.
        </p>

        <div class="text-center mb-3">
            <h5 style="color: #666;">Kalan Süre: 
                <span id="timer" class="fw-bold" style="color: #e74c3c;">05:00</span>
            </h5>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label for="verification_code" class="form-label">Doğrulama Kodu</label>
                <input type="text" class="form-control" id="verification_code" name="verification_code" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-login text-white w-100" id="submit-button">Doğrula</button>
        </form>
        
        <div class="links">
             <p><a href="{% url 'anasayfa' %}">← Ana Sayfaya Dön</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let duration = {{ remaining_seconds|default:300 }};
            const timerDisplay = document.getElementById('timer');
            const submitButton = document.getElementById('submit-button');

            const interval = setInterval(function() {
                // Saniyeleri dakika ve saniyeye çevir
                let minutes = Math.floor(duration / 60);
                let seconds = duration % 60;

                // Ekrana 05:09 gibi iki haneli formatta yazdır
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                timerDisplay.textContent = minutes + ":" + seconds;

                // Süre bitti mi kontrol et
                if (--duration < 0) {
                    clearInterval(interval);
                    timerDisplay.textContent = "Süre Doldu!";
                    timerDisplay.style.color = "#dc3545"; // Kırmızı Hata Rengi
                    
                    // Butonu devre dışı bırak ve metni değiştir
                    submitButton.disabled = true;
                    submitButton.textContent = "Süre Doldu, Yeniden Kayıt Olun";
                    
                    // Formdaki giriş alanını da kilitle
                    document.getElementById('verification_code').disabled = true;
                }
            }, 1000); // Her saniyede bir çalıştır
        });
    </script>
</body>
</html>
