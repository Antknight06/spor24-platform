<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxing Images Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .image-container {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        h1, h2 {
            color: #333;
        }
        .note {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Boxing Images Test Page</h1>
        
        <div class="note">
            <p><strong>Note:</strong> This is a test page to verify that the default boxing images are accessible.</p>
        </div>
        
        <div class="image-container">
            <h2>Default Boxing Glove SVG</h2>
            <img src="/static/boxing/default_boxing_glove.svg" alt="Default Boxing Glove">
            <p>Path: /static/boxing/default_boxing_glove.svg</p>
        </div>
        
        <div class="image-container">
            <h2>Boxing News Banner</h2>
            <img src="/static/boxing/default_boxing.png" alt="Boxing News Banner">
            <p>Path: /static/boxing/default_boxing.png</p>
        </div>
        
        <div class="image-container">
            <h2>Boxing Icon</h2>
            <img src="/static/boxing/boxing_icon.svg" alt="Boxing Icon" style="width: 100px; height: 100px;">
            <p>Path: /static/boxing/boxing_icon.svg</p>
        </div>
    </div>
</body>
</html>
